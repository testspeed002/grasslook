name: Grasslook
options:
  bundleIdPrefix: com.grasslook
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    COMBINE_HIDPI_IMAGES: YES
    GCC_PREPROCESSOR_DEFINITIONS:
      - "$(inherited)"

targets:
  Grasslook:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_NAME: Grasslook
        PRODUCT_BUNDLE_IDENTIFIER: com.grasslook.app
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Grasslook. All rights reserved."
        INFOPLIST_KEY_NSAccessibilityUsageDescription: "Grasslook requires Accessibility permissions to monitor frontmost browser tabs and distracting application switches."
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "Grasslook uses AppleScript to query active browser URLs for mindful friction delays."
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_CFBundleIconFile: AppIcon
        CODE_SIGN_ENTITLEMENTS: Entitlements/Grasslook.entitlements
        OTHER_CODE_SIGN_FLAGS: '--requirements "=designated => identifier \"com.grasslook.app\""'
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  GrasslookTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests
    dependencies:
      - target: Grasslook
    settings:
      base:
        PRODUCT_NAME: GrasslookTests
        PRODUCT_BUNDLE_IDENTIFIER: com.grasslook.tests
        CODE_SIGN_ENTITLEMENTS: Entitlements/GrasslookTests.entitlements
        GENERATE_INFOPLIST_FILE: YES
