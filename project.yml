name: Grasslook
options:
  bundleIdPrefix: com.grasslook
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    COMBINE_HIDPI_IMAGES: YES
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    GCC_PREPROCESSOR_DEFINITIONS:
      - "$(inherited)"

targets:
  Grasslook:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Grasslook-Info.plist
      properties:
        NSAppSleepDisabled: true
        NSSupportsSuddenTermination: false
        NSSupportsAutomaticTermination: false
    settings:
      base:
        PRODUCT_NAME: Grasslook
        PRODUCT_BUNDLE_IDENTIFIER: com.grasslook.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSAppSleepDisabled: YES
        INFOPLIST_KEY_NSSupportsSuddenTermination: NO
        INFOPLIST_KEY_NSSupportsAutomaticTermination: NO
        INFOPLIST_KEY_NSAccessibilityUsageDescription: "Grasslook requires Accessibility permissions to monitor frontmost browser tabs and distracting application switches."
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "Grasslook uses AppleScript to check active browser tabs for blocked URLs."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Entitlements/Grasslook.entitlements
        OTHER_CODE_SIGN_FLAGS: '--requirements "=designated => identifier \"com.grasslook.app\""'
        GENERATE_INFOPLIST_FILE: YES

  GrasslookTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests
    dependencies:
      - target: Grasslook
    settings:
      base:
        PRODUCT_NAME: GrasslookTests
        PRODUCT_BUNDLE_IDENTIFIER: com.grasslook.tests
        CODE_SIGN_ENTITLEMENTS: Entitlements/GrasslookTests.entitlements
        GENERATE_INFOPLIST_FILE: YES
